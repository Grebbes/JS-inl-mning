<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer src="locations.js"></script>
    <script defer src="fighting.js"></script>
    <script defer src="main.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="fullscreen">
      <div class="player-window" id="player-window">
        <div class="stats">
          <span class="stat"
            >XP: <strong><span id="xp-Text">0</span></strong></span
          >
          <span class="stat"
            >Health: <strong><span id="health-Text">100</span></strong></span
          >
          <span class="stat">Gold: <strong><span id="gold-Text">50</span></strong></span
          >
          <span class="stat">Potions: <strong><span id="potion-Text">0</span></strong></span>
        </div>
        <div id="monsterstats">
          <span class="stat"
            >Monster Name: <strong><span id="monster-Name"></span></strong
          ></span>
          <span class="stat"
            >Health: <strong><span id="monster-Health"></span></strong
          ></span>
        </div>
        <div class="controls">
          <button id="button1">Help the town</button>
          <button id="button2">Turn around and leave them</button>
          <button id="button3">Text</button>
          <button id="button4">Text</button>
        </div>
        <div id="text">
          Greetings, traveler... thank the gods you've arrived. Our town is
          falling, orc raiders attack without mercy, and fear grips us all.
          Please... we are in desperate need of help. Will you lend us a hand
          before everything is lost?
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="fullscreen">
      <div class="player-window" id="player-window">
        <div class="stats">
          <span class="stat">XP: <strong><span id="xp-Text">0</span></strong></span>
          <span class="stat">Health: <strong><span id="xp-Text">100</span></strong></span>
          <span class="stat">Gold: <strong><span id="xp-Text">50</span></strong></span>
        </div>
        <div id="monsterstats">
          <span class="stat">Monster Name: <strong><span id="monster-name"></span></strong></span>
          <span class="stat">Health: <strong><span id="monster-health"></span></strong></span>
        </div>
        <div class="controls">
          <button id="button1">Help the town</button>
          <button id="button2">Turn around and leave them</button>
          <button id="button3">Text</button>
          <button id="button4">Text</button>
        </div>
        <div id="text">
          Greeting traveler, our town is in dire need of help! would you help us please?
        </div>
      </div>
    </div>
</body>
</html>
